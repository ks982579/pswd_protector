[package]
name = "pswdstore"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
dirs = "5.0"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.4"
arboard = "3.2"
